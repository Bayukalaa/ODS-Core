<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ODS-Core Server Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #121212;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        #sidebar {
            background-color: #212529;
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 56px; /* navbar height */
            left: 0;
            overflow-y: auto;
            padding-top: 1rem;
        }
        #content {
            margin-left: 250px;
            padding: 1.5rem;
            margin-top: 56px; /* navbar height */
            flex-grow: 1;
            overflow-y: auto;
        }
        a.sidebar-link {
            color: white;
            text-decoration: none;
            display: block;
            padding: 0.5rem 1rem;
        }
        a.sidebar-link:hover, a.sidebar-link.active {
            background-color: #343a40;
            color: #0d6efd;
        }
        .navbar-dark {
            background-color: #212529;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">Server Settings</span>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
</nav>

<!-- Sidebar -->
<aside id="sidebar">
    <nav class="nav flex-column">
        <a href="settings.html" class="sidebar-link active">Settings Home</a>
        <a href="#" class="sidebar-link">General</a>
        <a href="#" class="sidebar-link">Players</a>
        <a href="#" class="sidebar-link">Plugins</a>
        <a href="#" class="sidebar-link">Logs</a>
    </nav>
</aside>

<!-- Main Content -->
<main id="content">
    <h2>Server Settings</h2>
    <form id="settingsForm">
        <div class="mb-3">
            <label for="motdInput" class="form-label">MOTD</label>
            <input type="text" class="form-control" id="motdInput" placeholder="Enter new MOTD" />
        </div>
        <div class="mb-3">
            <label for="maintenanceMode" class="form-label">Maintenance Mode</label>
            <select class="form-select" id="maintenanceMode">
                <option value="true">Enabled</option>
                <option value="false" selected>Disabled</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="whitelistEditor" class="form-label">Whitelist (one username per line)</label>
            <textarea class="form-control" id="whitelistEditor" rows="5" placeholder="admin1&#10;admin2"></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Save Settings</button>
        <a href="../index.html" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Logout butonuna tıklandığında dashboard sayfasına yönlendir
    document.getElementById('logoutBtn').addEventListener('click', () => {
        // Burada gerçek logout işlemini yapabilirsin (örneğin token silme)
        window.location.href = '../index.html';
    });

    // Form gönderme işlemi (mock)
    document.getElementById('settingsForm').addEventListener('submit', e => {
        e.preventDefault();

        const motd = document.getElementById('motdInput').value;
        const devMode = document.getElementById('maintenanceMode').value;
        const whitelist = document.getElementById('whitelistEditor').value
            .split('\n')
            .map(line => line.trim())
            .filter(line => line.length > 0);

        console.log("MOTD:", motd);
        console.log("Maintenance Mode:", devMode);
        console.log("Whitelist:", whitelist);

        alert('Settings saved (mock).');
    });
</script>

</body>
</html>
