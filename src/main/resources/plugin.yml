name: ODSCore
version: '0.1.2'
main: dev.onlydarknesss.ODSCore.Main
api-version: '1.20'
prefix: ODS-Core
authors: [ OnlyDarknesss ]
description: Developed by OnlyDarknesss
website: https://onlydarknesss.dev
commands:
  wl:
    description: Adds a player to the maintenance whitelist
    usage: /wl <add/remove/list/clear> [player]
    permission: odscore.whitelist

  ods:
    description: Main command for ODS system management
    usage: /ods <help|admin|settings|maintenance>
    permission: ods.default
    aliases: [ odscore ]

permissions:
  ods.default:
    description: Base permission to use /ods command
    default: true

    ods.admin:
      description: Allows access to /ods admin and /ods maintenance
      default: op

    ods.settings:
      description: Allows access to /ods settings
      default: op

    ods.bypass:
      description: Bypass permission for all ODS commands
      default: op

    odscore.whitelist:
      default: op